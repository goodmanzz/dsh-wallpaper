name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: npm run check

      - name: Validate JSON manifests
        run: |
          node -e "const fs = require('node:fs'); for (const file of ['package.json', 'locale/en.json', 'locale/zh.json']) JSON.parse(fs.readFileSync(file, 'utf8'));"
